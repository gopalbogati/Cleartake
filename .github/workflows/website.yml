name: Check download website
on:
  pull_request:
    paths: ['engine/website/**', 'engine/scripts/build-website.cjs', 'engine/package.json', 'engine/vercel.json', 'scripts/build-website.cjs', 'tests/downloads.test.cjs', 'tests/website-build.test.cjs', 'vercel.json', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['engine/website/**', 'engine/scripts/build-website.cjs', 'engine/package.json', 'engine/vercel.json', 'scripts/build-website.cjs', 'tests/downloads.test.cjs', 'tests/website-build.test.cjs', 'vercel.json', '.github/workflows/website.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-website.cjs
      - run: node --test tests/downloads.test.cjs tests/website-build.test.cjs
