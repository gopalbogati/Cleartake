name: Build Mac and Windows downloads
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop-downloads.yml
      - scripts/build-media.sh
      - scripts/build-mac.sh
      - scripts/build-windows.cjs
      - scripts/install-built-media.cjs
  workflow_dispatch:
    inputs:
      publish_downloads:
        description: Publish a development preview after both builds pass
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: desktop-downloads-${{ github.sha }}
  cancel-in-progress: false
jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac Apple Silicon
            os: macos-14
            artifact: ClearTake-Mac-arm64
          - name: Windows x64
            os: windows-2022
            artifact: ClearTake-Windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mac media build tools
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            make nasm diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
      - name: Build Mac media tools and retain their source
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/build-media.sh
      - name: Build Windows media tools and retain their source
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-media.sh
      - name: Build Mac and check bundled detector
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/build-mac.sh
      - name: Build Windows and check bundled detector
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/build-windows.cjs
      - name: Add build identity
        shell: bash
        run: |
          node -e 'require("fs").writeFileSync("release/BUILD-INFO.json",JSON.stringify({version:require("./package.json").version,commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,platform:process.platform,arch:process.arch},null,2))'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.sha256
            release/*Source*.tar.gz
            release/BUILD-INFO.json
          if-no-files-found: error
          retention-days: 30
      - name: Next step
        shell: bash
        run: |
          echo 'Download this artifact and test the app. Then attach the app ZIP (inside the artifact) and checksum to a GitHub prerelease matching the package version. The website finds published assets automatically.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    name: Publish development downloads
    if: ${{ github.event_name == 'push' || inputs.publish_downloads }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ClearTake-*
          path: release-assets
          merge-multiple: false
      - name: Publish app downloads and matching media source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Update the app version before creating another release."
            exit 1
          fi
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.sha256' -o -name '*Source*.tar.gz' \) -print0)
          version="${tag#v}"
          for expected in "ClearTake-Mac-$version-arm64.zip" "ClearTake-Mac-$version-arm64.dmg" "ClearTake-Windows-$version-x64.zip" 'ClearTake-Media-Source-Mac-arm64.tar.gz' 'ClearTake-Media-Source-Windows-x64.tar.gz'; do
            if [[ $(find release-assets -name "$expected" -type f | wc -l) -ne 1 ]]; then echo "Missing unique asset: $expected"; exit 1; fi
          done
          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --prerelease --title "ClearTake $tag — Development Preview" --notes-file docs/RELEASE-NOTES.md
          echo 'Development preview published with native build checks and matching media-tool sources. Native recording still needs device testing.' >> "$GITHUB_STEP_SUMMARY"
